<!DOCTYPE html>
<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">

<body>

  <header class="site-header">
    <nav class="navbar">
      <a href="home.html" class="nav-logo">

        <span class="logo-name">Miss <span>Melanie</span></span>
      </a>
      <div class="nav-actions">
        <button id="lang-toggle" class="lang-toggle" onclick="toggleLang()" aria-label="Changer de langue">EN</button>

  <section class="section" style="padding-top:64px;">
    <div class="container text-center" style="max-width:560px;">
      <div class="photo-placeholder" style="margin:0 auto 24px;">🎉</div>

      </p>
      <p style="color:var(--text-mid); margin-bottom:32px;"

        Melanie vous contactera à admin@missmelanie.online pour fixer vos 10 dates de cours.
      </p>
      <a href="home.html" class="btn-primary" data-fr="Retour à l'accueil" data-en="Back to home">Retour à l'accueil</a>
    </div>
  </section>

  <footer class="site-footer" style="margin-top:64px;">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 Miss Melanie · <span data-fr="Tous droits réservés" data-en="All rights reserved">Tous droits réservés</span></p>

  <script src="js/lang.js?v=9"></script>
